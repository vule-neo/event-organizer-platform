<div class="address-picker-wrapper">
  <label class="form-label">Pretraži adresu (Google Maps) *</label>
  <div class="input-group">
    <span class="input-icon">📍</span>
    <input 
      #addressInput 
      type="text" 
      class="google-input" 
      placeholder="Unesite ulicu i broj..."
      (keydown.enter)="$event.preventDefault()"
    />
  </div>
  <small class="text-muted">Obavezno odaberite predlog iz liste.</small>
</div>
