<div class="address-picker-wrapper">
  <div class="input-group">
    <i class="bi bi-geo-alt input-icon-bi"></i>
    <input
      #addressInput
      type="text"
      placeholder="Pretraži adresu (npr. Knez Mihailova 10, Beograd)..."
      class="address-input"
      autocomplete="off"
    />
  </div>
  <small class="address-hint"><i class="bi bi-info-circle"></i> Odaberite predlog iz padajuće liste da se automatski popune grad i ulica.</small>
</div>
