<div class="container py-4">
  <h2 class="fw-bold mb-4">⚙️ Admin Panel</h2>

  <div *ngIf="loading" class="text-center my-5">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div *ngIf="stats" class="row g-3 mb-5">
    <div class="col-6 col-md-3">
      <div class="card bg-primary text-white border-0 rounded-4 p-3 shadow-sm">
        <small class="opacity-75">Korisnici</small>
        <h3 class="fw-bold mb-0">{{ stats.totalUsers }}</h3>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card bg-success text-white border-0 rounded-4 p-3 shadow-sm">
        <small class="opacity-75">Tereni</small>
        <h3 class="fw-bold mb-0">{{ stats.totalVenues }}</h3>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card bg-warning text-dark border-0 rounded-4 p-3 shadow-sm">
        <small class="opacity-75">Aktivne Rezervacije</small>
        <h3 class="fw-bold mb-0">{{ stats.activeBookings }}</h3>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card bg-dark text-white border-0 rounded-4 p-3 shadow-sm">
        <small class="opacity-75">Ukupna Zarada</small>
        <h3 class="fw-bold mb-0">{{ stats.totalEarnings | number }} RSD</h3>
      </div>
    </div>
  </div>

  <div class="d-flex gap-3">
    <a routerLink="/admin/users" class="btn btn-outline-primary rounded-3 px-4 py-3 fw-bold">
      👥 Upravljaj Korisnicima
    </a>
    <a routerLink="/admin/venues" class="btn btn-outline-success rounded-3 px-4 py-3 fw-bold">
      🏟️ Upravljaj Terenima
    </a>
  </div>
</div>
