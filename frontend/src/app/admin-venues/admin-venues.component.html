<div class="owner-page">

  <!-- Header -->
  <div class="owner-page-header">
    <div class="owner-page-title">
      <h1>Tereni</h1>
      <p>Upravljanje svim terenima na platformi</p>
    </div>
    <a routerLink="/admin" class="btn-add-venue" style="background:var(--bg-secondary); color:var(--text); border:1.5px solid var(--border);">
      <i class="bi bi-arrow-left"></i> Nazad
    </a>
  </div>

  <div class="page-loading" *ngIf="loading">
    <div class="page-spinner"></div>
  </div>

  <div class="table-card" *ngIf="!loading">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Teren</th>
            <th>Sport</th>
            <th>Vlasnik</th>
            <th>Lokacija</th>
            <th>Cena</th>
            <th>Status</th>
            <th class="text-center">Akcije</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let v of venues" [class.row-inactive]="!v.is_active">
            <td>
              <div class="venue-thumb-cell">
                <img [src]="v.main_image ? (v.main_image.startsWith('http') ? v.main_image : apiBase + v.main_image) : 'assets/no-image.png'"
                     class="venue-thumb-img" />
                <span class="td-bold">{{ v.name }}</span>
              </div>
            </td>
            <td class="td-muted">{{ v.sport_name }}</td>
            <td>
              <div class="td-bold">{{ v.owner_name }}</div>
              <div class="td-micro">{{ v.owner_email }}</div>
            </td>
            <td class="td-muted td-small">{{ v.city }}, {{ v.street }}</td>
            <td class="td-price">{{ v.price_per_slot }} RSD</td>
            <td>
              <span class="table-status-badge"
                    [class.badge-confirmed]="v.is_active"
                    [class.badge-cancelled-client]="!v.is_active">
                {{ v.is_active ? 'Aktivan' : 'Neaktivan' }}
              </span>
            </td>
            <td class="text-center">
              <div class="table-actions">
                <button class="ovc-btn"
                        [class.ovc-btn-deactivate]="v.is_active"
                        [class.ovc-btn-activate]="!v.is_active"
                        (click)="toggleVenue(v)">
                  <i class="bi" [class.bi-toggle-on]="v.is_active" [class.bi-toggle-off]="!v.is_active"></i>
                  {{ v.is_active ? 'Deaktiviraj' : 'Aktiviraj' }}
                </button>
                <button class="ovc-btn ovc-btn-delete" (click)="deleteVenue(v)">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </td>
          </tr>
          <tr *ngIf="venues.length === 0">
            <td colspan="7" class="table-empty">Nema terena.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
