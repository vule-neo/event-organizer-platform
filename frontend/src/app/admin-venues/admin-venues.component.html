<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">🏟️ Svi Tereni</h4>
    <a routerLink="/admin" class="btn btn-outline-secondary btn-sm">← Nazad</a>
  </div>

  <div *ngIf="loading" class="text-center my-5">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div class="card border-0 shadow-sm rounded-4 overflow-hidden" *ngIf="!loading">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="bg-light">
          <tr>
            <th class="ps-4">Teren</th>
            <th>Sport</th>
            <th>Vlasnik</th>
            <th>Lokacija</th>
            <th>Cijena</th>
            <th>Status</th>
            <th class="pe-4 text-center">Akcije</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let v of venues" [class.opacity-50]="!v.is_active">
            <td class="ps-4">
              <div class="d-flex align-items-center gap-2">
                <img [src]="v.main_image ? 'http://localhost:5000' + v.main_image : 'assets/no-image.png'"
                     style="width:40px; height:40px; object-fit:cover; border-radius:8px;">
                <span class="fw-bold">{{ v.name }}</span>
              </div>
            </td>
            <td class="text-muted">{{ v.sport_name }}</td>
            <td>
              <div class="small fw-bold">{{ v.owner_name }}</div>
              <div class="text-muted" style="font-size:11px;">{{ v.owner_email }}</div>
            </td>
            <td class="text-muted small">{{ v.city }}, {{ v.street }}</td>
            <td class="fw-bold text-primary">{{ v.price_per_slot }} RSD</td>
            <td>
              <span class="badge rounded-pill"
                    [class.bg-success]="v.is_active"
                    [class.bg-secondary]="!v.is_active">
                {{ v.is_active ? 'Aktivan' : 'Neaktivan' }}
              </span>
            </td>
            <td class="pe-4 text-center">
              <div class="d-flex justify-content-center gap-2">
                <button class="btn btn-sm rounded-3"
                        [class.btn-outline-warning]="v.is_active"
                        [class.btn-outline-success]="!v.is_active"
                        (click)="toggleVenue(v)">
                  {{ v.is_active ? 'Deaktiviraj' : 'Aktiviraj' }}
                </button>
                <button class="btn btn-sm btn-outline-danger rounded-3"
                        (click)="deleteVenue(v)">
                  Obriši
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
