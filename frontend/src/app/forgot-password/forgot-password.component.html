<div class="container d-flex justify-content-center mt-5">
  <div class="card shadow-sm border-0 rounded-4 p-4" style="max-width: 440px; width: 100%;">
    <h4 class="fw-bold mb-1">Zaboravili ste lozinku?</h4>
    <p class="text-muted small mb-4">Unesite email i poslaćemo vam link za resetovanje.</p>

    <div *ngIf="!sent">
      <div class="mb-3">
        <label class="form-label small fw-bold">Email adresa</label>
        <input type="email" class="form-control" [(ngModel)]="email" placeholder="vas@email.com" />
      </div>
      <button class="btn btn-primary w-100" (click)="submit()" [disabled]="loading">
        {{ loading ? 'Slanje...' : 'Pošalji link' }}
      </button>
      <p class="text-danger small mt-2" *ngIf="error">{{ error }}</p>
    </div>

    <div *ngIf="sent" class="text-center py-3">
      <div class="fs-1 mb-3">📧</div>
      <h5 class="fw-bold">Email je poslan!</h5>
      <p class="text-muted small">Provjerite inbox i kliknite na link za resetovanje lozinke.</p>
    </div>
  </div>
</div>
