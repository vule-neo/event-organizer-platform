<!-- ============================================
     FORGOT PASSWORD — forgot-password.component.html
     ============================================ -->
<div class="simple-auth-page">
  <div class="simple-auth-card">

    <!-- Icon -->
    <div class="simple-auth-icon">
      <i class="bi bi-key"></i>
    </div>

    <ng-container *ngIf="!sent">
      <h2>Zaboravili ste lozinku?</h2>
      <p>Unesite email i poslaćemo vam link za resetovanje.</p>

      <div class="auth-form" style="margin-top: 28px;">
        <div class="form-group">
          <label>Email adresa</label>
          <div class="input-wrap">
            <i class="bi bi-envelope input-icon"></i>
            <input type="email" [(ngModel)]="email" placeholder="vas&#64;email.com" />
          </div>
        </div>

        <div class="error-msg" *ngIf="error">
          <i class="bi bi-exclamation-circle"></i> {{ error }}
        </div>

        <button class="btn-auth" (click)="submit()" [disabled]="loading">
          <span *ngIf="!loading"><i class="bi bi-send"></i> Pošalji link</span>
          <span *ngIf="loading" class="btn-loading">
            <span class="btn-spinner"></span> Slanje...
          </span>
        </button>

        <div class="simple-auth-back">
          <a routerLink="/login"><i class="bi bi-arrow-left"></i> Nazad na prijavu</a>
        </div>
      </div>
    </ng-container>

    <!-- Sent state -->
    <ng-container *ngIf="sent">
      <div class="simple-auth-success">
        <div class="simple-auth-icon simple-auth-icon-green">
          <i class="bi bi-envelope-check"></i>
        </div>
        <h2>Email je poslan!</h2>
        <p>Provjerite inbox i kliknite na link za resetovanje lozinke. Link važi 1 sat.</p>
        <a routerLink="/login" class="btn-auth" style="display:inline-flex; align-items:center; gap:8px; text-decoration:none; margin-top: 8px;">
          <i class="bi bi-box-arrow-in-right"></i> Idi na prijavu
        </a>
      </div>
    </ng-container>

  </div>
</div>
