<div class="container d-flex justify-content-center mt-5">
  <div class="card shadow-sm border-0 rounded-4 p-4" style="max-width: 440px; width: 100%;">

    <div *ngIf="!token" class="text-center py-3">
      <div class="fs-1 mb-2">⚠️</div>
      <p class="text-danger">Nevažeći link za resetovanje.</p>
    </div>

    <div *ngIf="token && !done">
      <h4 class="fw-bold mb-1">Nova lozinka</h4>
      <p class="text-muted small mb-4">Unesite novu lozinku za vaš nalog.</p>

      <div class="mb-3">
        <label class="form-label small fw-bold">Nova lozinka</label>
        <input type="password" class="form-control" [(ngModel)]="password" placeholder="Minimum 6 karaktera" />
      </div>
      <div class="mb-3">
        <label class="form-label small fw-bold">Potvrdi lozinku</label>
        <input type="password" class="form-control" [(ngModel)]="confirm" placeholder="Ponovi lozinku" />
      </div>

      <button class="btn btn-success w-100" (click)="submit()" [disabled]="loading">
        {{ loading ? 'Čuvanje...' : 'Sačuvaj novu lozinku' }}
      </button>
      <p class="text-danger small mt-2" *ngIf="error">{{ error }}</p>
    </div>

    <div *ngIf="done" class="text-center py-3">
      <div class="fs-1 mb-3">✅</div>
      <h5 class="fw-bold">Lozinka promijenjena!</h5>
      <p class="text-muted small">Možete se prijaviti sa novom lozinkom.</p>
      <button class="btn btn-primary mt-2" (click)="router.navigate(['/login'])">Prijavi se</button>
    </div>

  </div>
</div>
