<div class="simple-auth-page">
  <div class="simple-auth-card">

    <!-- Invalid token -->
    <ng-container *ngIf="!token">
      <div class="simple-auth-icon simple-auth-icon-red">
        <i class="bi bi-exclamation-triangle"></i>
      </div>
      <h2>Nevažeći link</h2>
      <p>Link za resetovanje je nevažeći ili je istekao.</p>
      <a routerLink="/forgot-password" class="btn-auth"
         style="display:inline-flex; align-items:center; gap:8px; text-decoration:none; margin-top:16px;">
        <i class="bi bi-arrow-repeat"></i> Zatraži novi link
      </a>
    </ng-container>

    <!-- Form -->
    <ng-container *ngIf="token && !done">
      <div class="simple-auth-icon">
        <i class="bi bi-shield-lock"></i>
      </div>
      <h2>Nova lozinka</h2>
      <p>Unesite novu lozinku za vaš nalog.</p>

      <div class="auth-form" style="margin-top: 28px;">
        <div class="form-group">
          <label>Nova lozinka</label>
          <div class="input-wrap">
            <i class="bi bi-lock input-icon"></i>
            <input [type]="showPassword ? 'text' : 'password'"
                   [(ngModel)]="password"
                   placeholder="Minimum 6 karaktera" />
            <button type="button" class="input-toggle" (click)="showPassword = !showPassword">
              <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label>Potvrdi lozinku</label>
          <div class="input-wrap">
            <i class="bi bi-lock-fill input-icon"></i>
            <input [type]="showPassword ? 'text' : 'password'"
                   [(ngModel)]="confirm"
                   placeholder="Ponovi lozinku"
                   [class.input-error]="confirm && password !== confirm" />
          </div>
          <span class="form-hint" *ngIf="confirm && password !== confirm" style="color:#dc3545;">
            Lozinke se ne poklapaju
          </span>
        </div>

        <div class="error-msg" *ngIf="error">
          <i class="bi bi-exclamation-circle"></i> {{ error }}
        </div>

        <button class="btn-auth" (click)="submit()" [disabled]="loading || !password || password !== confirm">
          <span *ngIf="!loading"><i class="bi bi-check-circle"></i> Sačuvaj novu lozinku</span>
          <span *ngIf="loading" class="btn-loading">
            <span class="btn-spinner"></span> Čuvanje...
          </span>
        </button>
      </div>
    </ng-container>

    <!-- Done -->
    <ng-container *ngIf="done">
      <div class="simple-auth-icon simple-auth-icon-green">
        <i class="bi bi-check-circle"></i>
      </div>
      <h2>Lozinka promijenjena!</h2>
      <p>Možete se prijaviti sa novom lozinkom.</p>
      <button class="btn-auth" (click)="router.navigate(['/login'])"
              style="display:inline-flex; align-items:center; gap:8px; margin-top:16px;">
        <i class="bi bi-box-arrow-in-right"></i> Prijavi se
      </button>
    </ng-container>

  </div>
</div>
