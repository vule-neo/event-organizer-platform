<div class="review-modal-overlay" (click)="close.emit()">
  <div class="review-modal" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="review-modal-header">
      <button class="close-modal" (click)="close.emit()">
        <i class="bi bi-x-lg"></i>
      </button>
      <div class="modal-icon">
        <i class="bi bi-star-fill"></i>
      </div>
      <h3>Ocenite teren</h3>
      <p>Vaše iskustvo je važno za <span class="venue-highlight">{{ booking?.venue_name }}</span></p>
    </div>

    <!-- Body -->
    <div class="review-modal-body">

      <!-- Rating section -->
      <div class="rating-section">
        <span class="rating-label">Tvoja ocena</span>
        <div class="star-rating">
          <button *ngFor="let star of [1,2,3,4,5]" class="star-btn" [class.lit]="star <= rating"
            (click)="setRating(star)">
            <i class="bi bi-star-fill"></i>
          </button>
        </div>
        <div class="rating-feedback">
          <span *ngIf="rating === 1" class="feedback-text"> Loše iskustvo</span>
          <span *ngIf="rating === 2" class="feedback-text"> Ispod proseka</span>
          <span *ngIf="rating === 3" class="feedback-text"> Zadovoljavajuće</span>
          <span *ngIf="rating === 4" class="feedback-text"> Vrlo dobro</span>
          <span *ngIf="rating === 5" class="feedback-text"> Odlično! Preporučujem</span>
        </div>
      </div>

      <!-- Comment section -->
      <div class="review-section">
        <label class="review-label">
          <i class="bi bi-chat-text-fill"></i> Tvoj komentar
        </label>
        <textarea [(ngModel)]="comment" class="review-textarea" rows="4"
          placeholder="Napiši svoje iskustvo... Kako je bilo? Šta ti se dopalo? Šta bi moglo bolje?"></textarea>
        <div class="char-counter" *ngIf="comment?.length">
          {{ comment.length }} / 500 karaktera
        </div>
      </div>

      <!-- Error message -->
      <div class="review-error" *ngIf="errorMessage">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span>{{ errorMessage }}</span>
      </div>

    </div>

    <!-- Footer -->
    <div class="review-modal-footer">
      <button class="btn-review-cancel" (click)="close.emit()">
        <i class="bi bi-x-lg"></i> Odustani
      </button>
      <button class="btn-review-submit" [disabled]="loading" (click)="saveReview()">
        <span *ngIf="!loading"><i class="bi bi-check-lg"></i> Objavi recenziju</span>
        <span *ngIf="loading"><i class="bi bi-arrow-repeat spin-icon"></i> Slanje...</span>
      </button>
    </div>

  </div>
</div>
