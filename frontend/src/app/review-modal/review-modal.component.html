<div class="review-modal-overlay">
  <div class="card border-0 shadow-lg review-card rounded-4 overflow-hidden">
    <div class="card-header bg-warning border-0 p-3 d-flex justify-content-between align-items-center">
      <h5 class="mb-0 fw-bold text-dark">Oceni: {{ booking?.venue_name }}</h5>
      <button type="button" class="btn-close" (click)="close.emit()"></button>
    </div>

    <div class="card-body p-4">
      <p class="text-muted small text-center mb-4">
        Vaša recenzija pomaže drugima da odaberu najbolji teren.
      </p>

      <div class="text-center mb-4">
        <div class="stars-container h2">
          <span *ngFor="let s of [1,2,3,4,5]" 
                (click)="setRating(s)" 
                [class.active]="s <= rating"
                class="star">
            ★
          </span>
        </div>
        <span class="badge bg-light text-dark border mt-2">Ocena: {{ rating }}/5</span>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold small">VAŠ KOMENTAR</label>
        <textarea [(ngModel)]="comment" 
                  class="form-control rounded-3" 
                  rows="3" 
                  placeholder="Kakvi su utisci o terenu i osoblju?">
        </textarea>
      </div>

      <div class="d-grid gap-2 mt-4">
        <button (click)="saveReview()" 
                [disabled]="loading" 
                class="btn btn-warning btn-lg fw-bold rounded-pill shadow-sm">
          {{ loading ? 'Slanje...' : 'Objavi Recenziju' }}
        </button>
        <button (click)="close.emit()" class="btn btn-link text-muted btn-sm">Odustani</button>
      </div>
    </div>
  </div>
</div>
