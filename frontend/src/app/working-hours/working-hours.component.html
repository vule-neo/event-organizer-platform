<div class="wh-container">
  <div class="wh-day-card" *ngFor="let day of workingHours" [class.wh-closed]="!day.is_open"
    [class.wh-open]="day.is_open">
    <!-- Header -->
    <div class="wh-day-header" (click)="toggleDay(day)">
      <div class="wh-day-info">
        <div class="wh-chk" [class.wh-chk-active]="day.is_open">
          <i class="bi bi-check-lg" *ngIf="day.is_open"></i>
        </div>
        <span class="wh-day-name">{{ day.day_name }}</span>
        <span class="wh-day-short" *ngIf="day.is_open && day.open_time && day.close_time">
          {{ day.open_time }} – {{ day.close_time }}
        </span>
      </div>
      <div class="wh-day-right">
        <span class="wh-badge wh-badge-open" *ngIf="day.is_open">Otvoreno</span>
        <span class="wh-badge wh-badge-closed" *ngIf="!day.is_open">Zatvoreno</span>
        <i class="bi wh-chevron" [class.bi-chevron-down]="!day.is_open" [class.bi-chevron-up]="day.is_open"></i>
      </div>
    </div>

    <!-- Time panel -->
    <div class="wh-time-panel" *ngIf="day.is_open">
      <div class="wh-time-group">
        <label>Otvaranje</label>
        <div class="wh-time-input-wrap">
          <i class="bi bi-sunrise wh-time-icon"></i>
          <div class="wh-selects-container">
            <select [(ngModel)]="day.open_hour" (click)="$event.stopPropagation()" (change)="updateTimeFromSelect(day)" class="wh-select">
              <option *ngFor="let h of hours" [value]="h">{{ h }}</option>
            </select>
            <span class="wh-colon">:</span>
            <select [(ngModel)]="day.open_minute" (click)="$event.stopPropagation()" (change)="updateTimeFromSelect(day)" class="wh-select">
              <option *ngFor="let m of minutes" [value]="m">{{ m }}</option>
            </select>
          </div>
        </div>
      </div>

      <div class="wh-time-arrow">
        <i class="bi bi-arrow-right"></i>
      </div>

      <div class="wh-time-group">
        <label>Zatvaranje</label>
        <div class="wh-time-input-wrap">
          <i class="bi bi-sunset wh-time-icon"></i>
          <div class="wh-selects-container">
            <select [(ngModel)]="day.close_hour" (click)="$event.stopPropagation()" (change)="updateTimeFromSelect(day)" class="wh-select">
              <option *ngFor="let h of hours" [value]="h">{{ h }}</option>
            </select>
            <span class="wh-colon">:</span>
            <select [(ngModel)]="day.close_minute" (click)="$event.stopPropagation()" (change)="updateTimeFromSelect(day)" class="wh-select">
              <option *ngFor="let m of minutes" [value]="m">{{ m }}</option>
            </select>
          </div>
        </div>
      </div>

      <div class="wh-duration" *ngIf="day.open_time && day.close_time">
        <i class="bi bi-clock-history"></i>
        {{ getDuration(day.open_time, day.close_time) }}
      </div>
    </div>
  </div>
</div>
